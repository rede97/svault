[package]
name = "svault"
version = "0.1.0"
edition = "2024"
description = "Svault — a content-addressed multimedia archive tool"
license = "MIT"
repository = "https://github.com/rede97/svault"
keywords = ["archive", "multimedia", "photos", "vault", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "svault"
path = "src/main.rs"

[features]
default = []

[dependencies]
svault-core = { version = "0.1.0", path = "../svault-core" }
svault-ui = { version = "0.1.0", path = "../svault-ui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
rayon = "1"
dunce = "1"
