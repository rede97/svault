name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      # ── Architecture guards (docs/ARCHITECTURE.md R1/R2) ──────────────────
      # R1: svault-core must not depend on terminal / CLI-parser crates
      - name: Guard R1 — no terminal deps in svault-core
        shell: bash
        run: |
          ! grep -E 'indicatif|console|rich_rust|clap' svault-core/Cargo.toml

      # R2: svault-core must not touch stdin/stdout/stderr directly
      # (doc-comment examples starting with /// are allowed)
      - name: Guard R2 — no direct terminal IO in svault-core
        shell: bash
        run: |
          ! grep -rn 'println!\|eprintln!\|read_line' svault-core/src --include='*.rs' | grep -v '///' | grep .

